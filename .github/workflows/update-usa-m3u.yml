name: Update USA TV Next M3U Playlist

on:
  schedule:
    # Run once daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Manual trigger button in GitHub Actions UI
  push:
    branches:
      - main
    paths:
      - 'convert_stremio_to_m3u.py'
      - 'generate_usa_epg.py'
      - 'usa_epg_common.py'
      - 'usa_epg_aliases.json'
      - 'usa_tv_next.m3u'
      - 'usa_epg.xml'
      - 'usa_epg.xml.gz'
      - 'usa_epg_report.csv'
      - '.github/workflows/update-usa-m3u.yml'

# The Jio workflow shares this group so the two auto-commits never race.
concurrency:
  group: automated-content-update
  cancel-in-progress: false

jobs:
  update-usa-m3u:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run USA M3U Converter Script
        run: |
          python convert_stremio_to_m3u.py

      - name: Generate USA EPG
        run: |
          python generate_usa_epg.py

      - name: Commit and push updated USA playlist and guide
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add usa_tv_next.m3u usa_epg.xml usa_epg.xml.gz usa_epg_report.csv
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Automated USA M3U & EPG Update [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
