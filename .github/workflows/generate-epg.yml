name: Generate and Update EPG & Playlist

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Manual trigger button in GitHub Actions UI
  push:
    branches:
      - main
    paths:
      - 'generate_epg.py'
      - 'epg_matcher.py'
      - 'channel_aliases.json'
      - 'generate_playlist.py'
      - 'epg.xml'
      - 'epg.xml.gz'
      - 'in_jio.m3u'
      - 'epg_match_report.csv'
      - '.github/workflows/generate-epg.yml'

# The USA workflow shares this group so the two auto-commits never race.
concurrency:
  group: automated-content-update
  cancel-in-progress: false

jobs:
  build-epg-and-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run EPG Adapter Script
        run: |
          python generate_epg.py

      - name: Run Playlist Generator Script
        run: |
          python generate_playlist.py

      - name: Commit and push updated EPG & Playlist files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add epg.xml.gz epg.xml in_jio.m3u epg_match_report.csv
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Automated EPG & Playlist Update [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
